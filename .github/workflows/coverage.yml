name: NFS coverage

# Coverage of upstream master merged from KUnit (.github/actions/kunit) and
# UML xfstests (.github/actions/xfstests-uml, one job per entry in the
# xfstests job's matrix). lcov merges line by line, so every job
# builds the one commit select-sha resolves. The jobs are described in
# docs/kunit-nfs.md, "CI".

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      check_args:
        description: 'Arguments for xfstests check in every xfstests job.'
        required: false
        default: '-g quick'

permissions:
  contents: read

# The tree this workflow covers. Unlike xfstests-uml.yml, the matrix entries
# here cannot override it: lcov merges line by line, so every job has to
# build the one commit select-sha resolves. Change these to cover a different
# branch, for example one of the NFSD queues in cel/linux.git.
env:
  DEFAULT_LINUX_URL: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
  DEFAULT_LINUX_REF: master

jobs:
  select-sha:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      # A branch ref, since this resolves refs/heads. A tag or a bare SHA in
      # DEFAULT_LINUX_REF would not resolve and the run stops here.
      - id: resolve
        run: |
          sha="$(git ls-remote "$DEFAULT_LINUX_URL" \
            "refs/heads/${DEFAULT_LINUX_REF}" | cut -f1)"
          [ -n "$sha" ] ||
            { echo "no ${DEFAULT_LINUX_REF} at ${DEFAULT_LINUX_URL}" >&2; exit 1; }
          echo "linux ${DEFAULT_LINUX_REF} is $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  kunit:
    name: coverage kunit
    needs: select-sha
    runs-on: ubuntu-latest
    # A CONFIG_GCOV-instrumented build compiles slower than a plain one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kunit
        with:
          linux_ref: ${{ needs.select-sha.outputs.sha }}
          linux_url: ${{ env.DEFAULT_LINUX_URL }}
          coverage: 'true'
          artifact: coverage-kunit

  # This workflow's own mount and server configurations. xfstests-uml.yml has
  # a separate matrix on purpose, so changing either does not silently change
  # the other. include with no other matrix key gives one job per entry; a
  # base dimension alongside it would merge the entries into a single job.
  # Keep the names in step with the merge job's "names" array below.
  xfstests:
    name: coverage xfstests (${{ matrix.name }})
    needs: select-sha
    runs-on: ubuntu-latest
    # -g quick took 73-77 minutes per run without gcov; gcov's cost is not
    # measured yet.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: delegations-off
            vers: '4.2'
            delegations: 'off'
          - name: delegations-on
            vers: '4.2'
          - name: v4.1
            vers: '4.1'
          - name: v4.0
            vers: '4.0'
          - name: v3
            vers: '3'
          - name: nconnect-4
            vers: '4.2'
            opts: nconnect=4
          - name: krb5i
            vers: '4.2'
            sec: krb5i
            patches: svc-send-account-reply-pages.patch
          - name: krb5p
            vers: '4.2'
            sec: krb5p
            patches: svcauth-gss-unwrap-priv-krb5p.patch
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xfstests-uml
        with:
          linux_ref: ${{ needs.select-sha.outputs.sha }}
          linux_url: ${{ env.DEFAULT_LINUX_URL }}
          nfs_vers: ${{ matrix.vers }}
          nfs_opts: ${{ matrix.opts }}
          nfs_sec: ${{ matrix.sec }}
          nfs_delegations: ${{ matrix.delegations || 'on' }}
          exclude_file: ${{ matrix.exclude_file }}
          patches: ${{ matrix.patches }}
          coverage: 'true'
          check_args: ${{ inputs.check_args || '-g quick' }}
          artifact: coverage-xfstests-${{ matrix.name }}

  # Runs even when a suite had failing tests, and merges whatever tracefiles
  # exist, so coverage-diff always has something to compare. It ends red when
  # any suite was red or a tracefile is missing, and publish-coverage-pages
  # then publishes nothing: the results are incomplete.
  merge:
    name: coverage (merged)
    needs: [select-sha, kunit, xfstests]
    if: always() && needs.select-sha.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lcov

      # Pristine, at the path the suites built in: genhtml renders from it and
      # coverage-filter.py asks its git which files are tracked.
      - name: Fetch the kernel tree
        env:
          LINUX_REF: ${{ needs.select-sha.outputs.sha }}
          LINUX_URL: ${{ env.DEFAULT_LINUX_URL }}
        run: bash scripts/fetch-sources.sh linux

      - name: Download the suites' coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: in

      # derive_function_end_line=0 on every lcov/genhtml call that reads merged
      # data, locally too: the suites' configs end some functions on different
      # lines, and lcov 2.0 aborts on that with an error code no
      # --ignore-errors value matches ($ERROR_INCONSISTENT is never defined).
      - name: Filter and merge
        id: merge
        shell: bash
        run: |
          set -e
          mkdir -p coverage/by-suite
          args=()
          missing=0
          # One entry per xfstests variant. The test name gets '_' for '.' and
          # '-', keeping the existing xfstests_delegations_* names.
          pairs=(kunit:coverage-kunit/coverage/coverage.info)
          # The xfstests job's matrix names. Listed again here because a
          # matrix is not readable from another job: this is what makes a leg
          # that ran but produced no tracefile an error rather than a silent
          # gap. Keep it in step with that matrix.
          names=(delegations-off delegations-on v4.1 v4.0 v3 nconnect-4 krb5i krb5p)
          for v in "${names[@]}"; do
            pairs+=("xfstests_$(tr '.-' '__' <<<"$v"):coverage-xfstests-${v}/coverage/xfstests-uml/coverage.info")
          done
          for pair in "${pairs[@]}"; do
            name="${pair%%:*}"; src="in/${pair#*:}"
            if [ ! -s "$src" ]; then
              echo "::error::no or empty tracefile from ${name} (${src}); merged without it"
              missing=1
              continue
            fi
            python3 scripts/coverage-filter.py linux "$name" "$src" "coverage/by-suite/${name}.info"
            args+=(-a "coverage/by-suite/${name}.info")
          done
          echo "missing=${missing}" >> "$GITHUB_OUTPUT"
          [ ${#args[@]} -gt 0 ] || { echo "::error::no tracefiles at all"; exit 1; }
          rc=(--ignore-errors mismatch --rc derive_function_end_line=0)
          lcov -q "${args[@]}" -o coverage/coverage.info "${rc[@]}"
          genhtml -q --show-details -o coverage/html coverage/coverage.info "${rc[@]}"

      - name: Summarise
        if: always()
        shell: bash
        run: |
          rc=(--rc derive_function_end_line=0)
          lines() { lcov --summary "$1" "${rc[@]}" 2>&1 | grep -E '^ *lines' | tr -s ' '; }
          {
            echo "Linux ${{ env.DEFAULT_LINUX_REF }} \`${{ needs.select-sha.outputs.sha }}\`"
            echo '```'
            for f in coverage/by-suite/*.info coverage/coverage.info; do
              [ -f "$f" ] || continue
              echo "$(basename "$f" .info): $(lines "$f")"
            done
            for dir in fs/nfs fs/nfsd net/sunrpc; do
              lcov -q --extract coverage/coverage.info "*/linux/${dir}/*" -o /tmp/dir.info \
                "${rc[@]}" 2>/dev/null && echo "merged ${dir}: $(lines /tmp/dir.info)"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the merged coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-master
          path: coverage/
          if-no-files-found: warn

      # Last, after the upload, so coverage-diff still gets the merge.
      - name: Fail if any suite failed or is missing
        if: >-
          always() && (needs.kunit.result != 'success' ||
          needs.xfstests.result != 'success' ||
          steps.merge.outputs.missing != '0')
        run: |
          echo "::error::kunit: ${{ needs.kunit.result }}, xfstests: ${{ needs.xfstests.result }}, missing tracefile: ${{ steps.merge.outputs.missing }}"
          exit 1

  # Push to master only: Pages serves one site, so a PR must not overwrite it.
  # Only when every suite and the merge are green: anything red means the
  # results are incomplete.
  # One-time manual step this job depends on: repo Settings -> Pages ->
  # Source: GitHub Actions. Not settable from a workflow.
  publish-coverage-pages:
    name: Publish coverage to GitHub Pages
    needs: [kunit, xfstests, merge]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.kunit.result == 'success' && needs.xfstests.result == 'success' &&
      needs.merge.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-master
          path: artifact

      - uses: actions/configure-pages@v5

      # Pages wants index.html at the site root.
      - name: Assemble the Pages site
        run: |
          mkdir site
          cp -r artifact/html/. site/
          cp artifact/coverage.info site/
          cp -r artifact/by-suite site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

  # Runs whenever merge ran, red or not. Base is the latest push-to-master run
  # whose merge was green (so complete), from its artifact, not Pages.
  # On a fork PR GITHUB_TOKEN is read-only, so the comment step may no-op.
  coverage-diff:
    name: Coverage diff vs master
    needs: merge
    if: always() && (needs.merge.result == 'success' || needs.merge.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download this run's coverage
        id: head
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-master
          path: head-coverage

      - name: Find the latest successful master coverage run
        id: base-run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'coverage.yml',
              branch: 'master',
              event: 'push',
              status: 'completed',
              per_page: 20,
            });
            for (const run of runs.data.workflow_runs) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const merged = jobs.data.jobs.find(j => j.name === 'coverage (merged)');
              if (merged && merged.conclusion === 'success') {
                core.setOutput('run_id', String(run.id));
                break;
              }
            }

      - name: Download master's coverage
        if: steps.base-run.outputs.run_id
        uses: actions/download-artifact@v4
        with:
          name: coverage-master
          path: base-coverage
          run-id: ${{ steps.base-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute diff
        if: steps.base-run.outputs.run_id && hashFiles('head-coverage/coverage.info') != ''
        run: |
          python3 scripts/kunit/coverage-diff.py \
            base-coverage/coverage.info \
            head-coverage/coverage.info \
            > coverage-diff.md

      - name: Write the diff to the job summary
        if: always()
        run: |
          if [ -f coverage-diff.md ]; then
            cat coverage-diff.md >> "$GITHUB_STEP_SUMMARY"
          elif [ ! -f head-coverage/coverage.info ]; then
            echo 'This run produced no merged coverage to diff.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No prior push-to-master run with a successful merged coverage job found to diff against.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on the PR
        if: github.event_name == 'pull_request' && hashFiles('coverage-diff.md') != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- kunit-coverage-diff -->';
            const body = marker + '\n' + fs.readFileSync('coverage-diff.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
