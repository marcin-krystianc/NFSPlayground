name: xfstests in UML (reusable)

# One UML xfstests run: build a UML kernel from linux_ref and run upstream
# xfstests against its own knfsd and NFS client, via
# scripts/00-run-xfstests-in-uml.sh. Called by xfstests-uml.yml and
# coverage.yml; the callers own the matrices.

on:
  workflow_call:
    inputs:
      linux_ref:
        description: 'Kernel ref or commit for fetch-sources.sh.'
        type: string
        required: true
      variant:
        description: 'One entry of .github/xfstests-variants.json, as JSON.'
        type: string
        required: true
      patches:
        description: 'Space-separated files in patches/ to apply to the kernel, in order.'
        type: string
        default: ''
      coverage:
        type: boolean
        default: false
      trace_events:
        description: 'Kernel trace events recorded in the guest (uml-run/trace.txt).'
        type: string
        default: ''
      check_args:
        type: string
        default: '-g quick'
      artifact:
        description: 'Name of the uploaded results artifact.'
        type: string
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    # -g quick took 73-77 minutes per run without gcov. Below the 6-hour
    # limit so a slow run still uploads its results.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the xfstests submodule
        run: git submodule update --init xfstests

      # The kernel build, xfstests' own build and runtime, the NFS server
      # userspace the guest runs from the host, the KDC for the krb5
      # variants, and lcov for coverage.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev \
            nfs-kernel-server nfs-common \
            autoconf automake libtool-bin pkg-config gettext \
            uuid-dev libattr1-dev libacl1-dev libaio-dev libgdbm-dev \
            xfslibs-dev xfsprogs e2fsprogs attr acl quota \
            gawk psmisc procps python3 uuid-runtime fio dbench dump \
            libcap-dev liburing-dev lcov \
            krb5-kdc krb5-admin-server krb5-user

      - name: Fetch the kernel tree
        env:
          LINUX_REF: ${{ inputs.linux_ref }}
        run: bash scripts/fetch-sources.sh linux

      - name: Apply patches
        if: inputs.patches != ''
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          for p in $PATCHES; do
            git -C linux apply --check "${GITHUB_WORKSPACE}/patches/${p}"
            git -C linux apply "${GITHUB_WORKSPACE}/patches/${p}"
            echo "applied ${p}"
          done

      # With coverage, the runner collects it before exiting with check's
      # status, so a run with failing tests still produces a tracefile.
      - name: Run xfstests in UML
        shell: bash
        env:
          CHECK_ARGS: ${{ inputs.check_args }}
          NFS_VERS: ${{ fromJson(inputs.variant).vers }}
          NFS_MOUNT_OPTS: ${{ fromJson(inputs.variant).opts }}
          NFS_SEC: ${{ fromJson(inputs.variant).sec }}
          NFS_DELEGATIONS: ${{ fromJson(inputs.variant).delegations == 'on' && '1' || '0' }}
          COVERAGE: ${{ inputs.coverage && '1' || '0' }}
          TRACE_EVENTS: ${{ inputs.trace_events }}
        run: |
          set -o pipefail
          bash scripts/00-run-xfstests-in-uml.sh $CHECK_ARGS 2>&1 | tee xfstests.log

      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            echo '```'
            sed -n '/^==> under test/,/^$/p' xfstests.log 2>/dev/null
            grep -E '^(Failures|Failed|Passed)' xfstests.log 2>/dev/null ||
              echo "no result trailer -- the run did not finish"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The diff and .full tail of each failure, so the job log alone is
      # enough to see what failed.
      - name: Show failure details
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for f in xfstests/results/*/*.out.bad; do
            t=${f#xfstests/results/}; t=${t%.out.bad}
            echo "::group::${t} diff"
            diff -u "xfstests/tests/${t}.out" "$f" || true
            echo "::endgroup::"
            if [ -f "xfstests/results/${t}.full" ]; then
              echo "::group::${t}.full (last 200 lines)"
              tail -n 200 "xfstests/results/${t}.full"
              echo "::endgroup::"
            fi
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            xfstests.log
            xfstests/results/
            uml-run/dmesg.txt
            uml-run/trace.txt
            coverage/xfstests-uml/coverage.info
            coverage/xfstests-uml/lcov.log
            linux/.xfstests-uml/build.log
          if-no-files-found: warn
