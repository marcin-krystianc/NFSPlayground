name: NFS xfstests (UML)

# Runs upstream xfstests against NFS inside a User Mode Linux kernel built
# from each linux_ref, via scripts/00-run-xfstests-in-uml.sh. The NFS client
# and knfsd under test are that kernel's, unlike the NFS xfstests workflow,
# which can only test the runner's own kernel. Userspace (xfstests, xfsprogs,
# nfs-utils) is the runner's, reached from the guest over hostfs.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      check_args:
        description: 'Arguments for xfstests check.'
        required: false
        default: '-g quick'
      trace_events:
        description: 'Kernel trace events recorded in the guest (uml-run/trace.txt). Empty uses the list in the run step.'
        required: false

permissions:
  contents: read

jobs:
  xfstests-uml:
    name: xfstests (UML, linux ${{ matrix.linux_ref }}, delegations ${{ matrix.delegations }})
    runs-on: ubuntu-latest
    # -g quick took 73-77 minutes per leg. Below the 6-hour limit so a slow
    # leg still uploads its results.
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        linux_ref: ['v6.12.57', 'master']
        # A failure only in the 'on' leg points at the delegated path.
        delegations: ['on', 'off']

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the xfstests submodule
        run: git submodule update --init xfstests

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev \
            nfs-kernel-server nfs-common \
            autoconf automake libtool-bin pkg-config gettext \
            uuid-dev libattr1-dev libacl1-dev libaio-dev libgdbm-dev \
            xfslibs-dev xfsprogs e2fsprogs attr acl quota \
            gawk psmisc procps python3 uuid-runtime fio dbench dump \
            libcap-dev liburing-dev

      - name: Fetch the kernel tree
        env:
          LINUX_REF: ${{ matrix.linux_ref }}
        run: bash scripts/fetch-sources.sh linux

      # A harness fix, not an NFS one: without it the v6.12.57 UML kernel
      # can livelock on host signals (docs/kunit-nfs-reference.md). The
      # NFS fixes in patches/ are deliberately not applied, so every leg
      # tests the tree as released.
      - name: Apply the UML host-signal livelock fix
        if: matrix.linux_ref == 'v6.12.57'
        run: |
          git -C linux apply --check "${GITHUB_WORKSPACE}/patches/um-thread-info-in-task-v6.12.57.patch"
          git -C linux apply "${GITHUB_WORKSPACE}/patches/um-thread-info-in-task-v6.12.57.patch"

      - name: Run xfstests in UML
        shell: bash
        env:
          CHECK_ARGS: ${{ inputs.check_args || '-g quick' }}
          NFS_DELEGATIONS: ${{ matrix.delegations == 'on' && '1' || '0' }}
          # The delegation and setattr path behind generic/258 and 634.
          TRACE_EVENTS: ${{ inputs.trace_events || 'nfs4:nfs4_set_delegation nfs4:nfs4_setattr nfs4:nfs4_delegreturn nfs4:nfs4_delegreturn_exit nfs4:nfs4_cb_getattr nfs4:nfs4_cb_recall nfs:nfs_setattr_enter nfsd:nfsd_deleg_write nfsd:nfsd_deleg_read nfsd:nfsd_deleg_return nfsd:nfsd_vfs_setattr nfsd:nfsd_cb_getattr_done nfsd:nfsd_cb_recall_done' }}
        run: |
          set -o pipefail
          bash scripts/00-run-xfstests-in-uml.sh $CHECK_ARGS 2>&1 | tee xfstests.log

      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            echo '```'
            sed -n '/^==> under test/,/^$/p' xfstests.log 2>/dev/null
            grep -E '^(Failures|Failed|Passed)' xfstests.log 2>/dev/null ||
              echo "no result trailer -- the run did not finish"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The diff and .full tail of each failure, so the job log alone is
      # enough to see what failed.
      - name: Show failure details
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for f in xfstests/results/*/*.out.bad; do
            t=${f#xfstests/results/}; t=${t%.out.bad}
            echo "::group::${t} diff"
            diff -u "xfstests/tests/${t}.out" "$f" || true
            echo "::endgroup::"
            if [ -f "xfstests/results/${t}.full" ]; then
              echo "::group::${t}.full (last 200 lines)"
              tail -n 200 "xfstests/results/${t}.full"
              echo "::endgroup::"
            fi
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfstests-uml-results-${{ matrix.linux_ref }}-delegations-${{ matrix.delegations }}
          path: |
            xfstests.log
            xfstests/results/
            uml-run/dmesg.txt
            uml-run/trace.txt
            linux/.xfstests-uml/build.log
          if-no-files-found: warn

  # The candidate fix in patches/svcauth-gss-unwrap-priv-krb5p.patch, tested
  # where it matters: master, sec=krb5p, full -g quick, with and without the
  # patch. Without it generic/486 fails under krb5p (see the patch header);
  # with it, it should pass and nothing else should change. No coverage or
  # tracing, so it builds and runs at plain speed.
  xfstests-uml-krb5p-fix:
    name: xfstests (UML, linux master, krb5p, svcauth_gss unwrap fix ${{ matrix.fix }})
    runs-on: ubuntu-latest
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        fix: ['with', 'without']

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the xfstests submodule
        run: git submodule update --init xfstests

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev \
            nfs-kernel-server nfs-common \
            autoconf automake libtool-bin pkg-config gettext \
            uuid-dev libattr1-dev libacl1-dev libaio-dev libgdbm-dev \
            xfslibs-dev xfsprogs e2fsprogs attr acl quota \
            gawk psmisc procps python3 uuid-runtime fio dbench dump \
            libcap-dev liburing-dev \
            krb5-kdc krb5-admin-server krb5-user

      - name: Fetch the kernel tree
        env:
          LINUX_REF: master
        run: bash scripts/fetch-sources.sh linux

      - name: Apply the svcauth_gss unwrap fix
        if: matrix.fix == 'with'
        run: |
          git -C linux apply --check "${GITHUB_WORKSPACE}/patches/svcauth-gss-unwrap-priv-krb5p.patch"
          git -C linux apply "${GITHUB_WORKSPACE}/patches/svcauth-gss-unwrap-priv-krb5p.patch"

      - name: Run xfstests in UML
        shell: bash
        env:
          CHECK_ARGS: ${{ inputs.check_args || '-g quick' }}
          NFS_SEC: krb5p
        run: |
          set -o pipefail
          bash scripts/00-run-xfstests-in-uml.sh $CHECK_ARGS 2>&1 | tee xfstests.log

      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            echo '```'
            sed -n '/^==> under test/,/^$/p' xfstests.log 2>/dev/null
            grep -E '^(Failures|Failed|Passed)' xfstests.log 2>/dev/null ||
              echo "no result trailer -- the run did not finish"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show failure details
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for f in xfstests/results/*/*.out.bad; do
            t=${f#xfstests/results/}; t=${t%.out.bad}
            echo "::group::${t} diff"
            diff -u "xfstests/tests/${t}.out" "$f" || true
            echo "::endgroup::"
            if [ -f "xfstests/results/${t}.full" ]; then
              echo "::group::${t}.full (last 200 lines)"
              tail -n 200 "xfstests/results/${t}.full"
              echo "::endgroup::"
            fi
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfstests-uml-results-master-krb5p-${{ matrix.fix }}-fix
          path: |
            xfstests.log
            xfstests/results/
            uml-run/dmesg.txt
            linux/.xfstests-uml/build.log
          if-no-files-found: warn
