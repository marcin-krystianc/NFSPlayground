name: NFS xfstests (UML)

# Runs upstream xfstests against NFS inside a User Mode Linux kernel built
# from each linux_ref, via scripts/00-run-xfstests-in-uml.sh. The NFS client
# and knfsd under test are that kernel's, unlike the NFS xfstests workflow,
# which can only test the runner's own kernel. Userspace (xfstests, xfsprogs,
# nfs-utils) is the runner's, reached from the guest over hostfs.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      check_args:
        description: 'Arguments for xfstests check.'
        required: false
        default: '-g quick'
      trace_events:
        description: 'Kernel trace events recorded in the guest (uml-run/trace.txt in the artifact).'
        required: false
        default: 'nfs4:nfs4_set_delegation nfs4:nfs4_setattr nfs4:nfs4_delegreturn nfs4:nfs4_delegreturn_exit nfs4:nfs4_cb_getattr nfs4:nfs4_cb_recall nfs:nfs_setattr_enter nfsd:nfsd_deleg_write nfsd:nfsd_deleg_read nfsd:nfsd_deleg_return nfsd:nfsd_vfs_setattr nfsd:nfsd_cb_getattr_done nfsd:nfsd_cb_recall_done'

permissions:
  contents: read

jobs:
  xfstests-uml:
    name: xfstests (UML, linux ${{ matrix.linux_ref }}, delegations ${{ matrix.delegations }})
    runs-on: ubuntu-latest
    # How long -g quick takes under UML on a runner is not measured yet.
    # Just under the 6-hour job limit, so a slow leg still uploads results.
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        linux_ref: ['v6.12.57', 'v6.18.52', 'v7.2.6', 'master']
        # knfsd delegations in the guest, via its fs.leases-enable. With them
        # on, the client answers timestamp and attribute questions itself;
        # a failure only in the 'on' leg points at the delegated path.
        delegations: ['on', 'off']

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch the xfstests submodule
        run: git submodule update --init xfstests

      # Kernel build dependencies, plus xfstests' own and the NFS server
      # userspace the guest runs from the host.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev \
            nfs-kernel-server nfs-common \
            autoconf automake libtool-bin pkg-config gettext \
            uuid-dev libattr1-dev libacl1-dev libaio-dev libgdbm-dev \
            xfslibs-dev xfsprogs e2fsprogs attr acl quota \
            bc gawk psmisc procps python3 uuid-runtime fio dbench dump \
            libcap-dev liburing-dev

      - name: Fetch the kernel tree
        env:
          LINUX_REF: ${{ matrix.linux_ref }}
        run: bash scripts/fetch-sources.sh linux

      # A harness fix, not an NFS one: without it the v6.12.57 UML kernel
      # can livelock on host signals (docs/kunit-nfs-reference.md). The
      # NFS fixes in patches/ are deliberately not applied, so every leg
      # tests the tree as released.
      - name: Apply the UML host-signal livelock fix
        if: matrix.linux_ref == 'v6.12.57'
        run: |
          git -C linux apply --check "${GITHUB_WORKSPACE}/patches/um-thread-info-in-task-v6.12.57.patch"
          git -C linux apply "${GITHUB_WORKSPACE}/patches/um-thread-info-in-task-v6.12.57.patch"

      - name: Run xfstests in UML
        shell: bash
        env:
          CHECK_ARGS: ${{ inputs.check_args || '-g quick' }}
          NFS_DELEGATIONS: ${{ matrix.delegations == 'on' && '1' || '0' }}
          # The delegation and setattr path behind generic/258 and 634.
          TRACE_EVENTS: ${{ inputs.trace_events || 'nfs4:nfs4_set_delegation nfs4:nfs4_setattr nfs4:nfs4_delegreturn nfs4:nfs4_delegreturn_exit nfs4:nfs4_cb_getattr nfs4:nfs4_cb_recall nfs:nfs_setattr_enter nfsd:nfsd_deleg_write nfsd:nfsd_deleg_read nfsd:nfsd_deleg_return nfsd:nfsd_vfs_setattr nfsd:nfsd_cb_getattr_done nfsd:nfsd_cb_recall_done' }}
        run: |
          set -o pipefail
          bash scripts/00-run-xfstests-in-uml.sh $CHECK_ARGS 2>&1 | tee xfstests.log

      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            echo '```'
            sed -n '/^==> under test/,/^$/p' xfstests.log 2>/dev/null
            grep -E '^(Ran|Not run|Failures|Failed|Passed)' xfstests.log 2>/dev/null ||
              echo "no result trailer -- the run did not finish"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The diff and .full tail of each failure, so the job log alone is
      # enough to see what failed.
      - name: Show failure details
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for f in xfstests/results/*/*.out.bad; do
            t=${f#xfstests/results/}; t=${t%.out.bad}
            echo "::group::${t} diff"
            diff -u "xfstests/tests/${t}.out" "$f" || true
            echo "::endgroup::"
            if [ -f "xfstests/results/${t}.full" ]; then
              echo "::group::${t}.full (last 200 lines)"
              tail -n 200 "xfstests/results/${t}.full"
              echo "::endgroup::"
            fi
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfstests-uml-results-${{ matrix.linux_ref }}-delegations-${{ matrix.delegations }}
          path: |
            xfstests.log
            xfstests/results/
            uml-run/dmesg.txt
            uml-run/trace.txt
            linux/.xfstests-uml/build.log
          if-no-files-found: warn

  # Coverage of master's NFS client, knfsd and everything under them, from
  # the same suite run twice in one job: delegations off, then on. The two
  # exercise different paths (the client answering from a delegation, and
  # the recall and delegated-timestamp code), so neither alone is the whole
  # picture. Kept out of the matrix above because the gcov build is only
  # wanted once, and the two runs need merging.
  xfstests-uml-coverage:
    name: xfstests coverage (UML, linux master, delegations off + on)
    runs-on: ubuntu-latest
    # Two -g quick runs of 73-77 minutes each without gcov, plus the gcov
    # overhead, which is not measured yet. At the 6-hour job limit.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch the xfstests submodule
        run: git submodule update --init xfstests

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev \
            nfs-kernel-server nfs-common \
            autoconf automake libtool-bin pkg-config gettext \
            uuid-dev libattr1-dev libacl1-dev libaio-dev libgdbm-dev \
            xfslibs-dev xfsprogs e2fsprogs attr acl quota \
            bc gawk psmisc procps python3 uuid-runtime fio dbench dump \
            libcap-dev liburing-dev lcov

      - name: Fetch the kernel tree
        env:
          LINUX_REF: master
        run: bash scripts/fetch-sources.sh linux

      # One kernel build: the second run finds it up to date. Each run
      # deletes the previous .gcda files first, so each coverage.info is
      # that run's alone, and results/ and uml-run/ are moved aside between
      # runs because the runner reuses both. A failing first run does not
      # skip the second; the step fails at the end if either did.
      - name: Run xfstests in UML, delegations off then on
        shell: bash
        env:
          CHECK_ARGS: ${{ inputs.check_args || '-g quick' }}
          COVERAGE: '1'
        run: |
          set -o pipefail
          rc=0
          for d in off on; do
            NFS_DELEGATIONS=$([ "$d" = on ] && echo 1 || echo 0) \
            COVERAGE_DIR="coverage/xfstests-uml/delegations-${d}" \
              bash scripts/00-run-xfstests-in-uml.sh $CHECK_ARGS 2>&1 |
              tee "xfstests-delegations-${d}.log" || rc=1
            mv xfstests/results "results-delegations-${d}" || true
            mv uml-run "uml-run-delegations-${d}" || true
          done
          lcov -q -a coverage/xfstests-uml/delegations-off/coverage.info \
                  -a coverage/xfstests-uml/delegations-on/coverage.info \
               -o coverage/xfstests-uml/coverage.info || rc=1
          exit $rc

      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            for d in off on; do
              echo "### delegations ${d}"
              echo '```'
              grep -E '^(Failures|Failed|Passed)' "xfstests-delegations-${d}.log" 2>/dev/null ||
                echo "no result trailer -- the run did not finish"
              echo '```'
            done
            if [ -f coverage/xfstests-uml/coverage.info ]; then
              echo "### coverage, both runs merged"
              echo '```'
              lcov --summary coverage/xfstests-uml/coverage.info 2>&1 | grep -E 'lines|functions'
              for dir in fs/nfs fs/nfsd net/sunrpc; do
                lcov -q --extract coverage/xfstests-uml/coverage.info "*/linux/${dir}/*" \
                  -o /tmp/dir.info 2>/dev/null &&
                  echo "${dir}: $(lcov --summary /tmp/dir.info 2>&1 | grep -E 'lines' | tr -s ' ')"
              done
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show failure details
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for f in results-delegations-*/*/*.out.bad; do
            r=${f%%/*}; t=${f#*/}; t=${t%.out.bad}
            echo "::group::${r} ${t} diff"
            diff -u "xfstests/tests/${t}.out" "$f" || true
            echo "::endgroup::"
          done

      # coverage.info only: the genhtml report is ~250 MB. Rebuild it with
      # genhtml -o html coverage/xfstests-uml/coverage.info.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfstests-uml-coverage-master
          path: |
            xfstests-delegations-*.log
            results-delegations-*/
            uml-run-delegations-*/dmesg.txt
            coverage/xfstests-uml/coverage.info
            coverage/xfstests-uml/delegations-*/coverage.info
            linux/.xfstests-uml/build.log
          if-no-files-found: warn
