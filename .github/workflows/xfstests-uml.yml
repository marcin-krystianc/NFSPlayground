name: NFS xfstests (UML)

# Runs upstream xfstests against NFS inside a User Mode Linux kernel built
# from each linux_ref, so the NFS client and knfsd under test are that
# kernel's, unlike the NFS xfstests workflow, which can only test the
# runner's own kernel. The job itself is xfstests-uml-run.yml; the mount
# and server variants are .github/xfstests-variants.json, shared with
# coverage.yml.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      check_args:
        description: 'Arguments for xfstests check.'
        required: false
        default: '-g quick'
      trace_events:
        description: 'Kernel trace events recorded in the guest (uml-run/trace.txt). Empty uses the default list below.'
        required: false

permissions:
  contents: read

jobs:
  variants:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "list=$(jq -c . .github/xfstests-variants.json)" >> "$GITHUB_OUTPUT"

  # The v6.12.57 legs get the UML host-signal livelock fix, a harness fix
  # (docs/kunit-nfs-reference.md). The NFS fixes in patches/ are not
  # applied, so every leg tests the tree as released. The trace events are
  # the delegation and setattr path behind generic/258 and 634.
  xfstests-uml:
    name: xfstests (UML, linux ${{ matrix.linux_ref }}, ${{ matrix.variant.name }})
    needs: variants
    strategy:
      fail-fast: false
      matrix:
        linux_ref: ['v6.12.57', 'master']
        variant: ${{ fromJson(needs.variants.outputs.list) }}
    uses: ./.github/workflows/xfstests-uml-run.yml
    with:
      linux_ref: ${{ matrix.linux_ref }}
      variant: ${{ toJson(matrix.variant) }}
      patches: ${{ matrix.linux_ref == 'v6.12.57' && 'um-thread-info-in-task-v6.12.57.patch' || '' }}
      check_args: ${{ inputs.check_args || '-g quick' }}
      trace_events: ${{ inputs.trace_events || 'nfs4:nfs4_set_delegation nfs4:nfs4_setattr nfs4:nfs4_delegreturn nfs4:nfs4_delegreturn_exit nfs4:nfs4_cb_getattr nfs4:nfs4_cb_recall nfs:nfs_setattr_enter nfsd:nfsd_deleg_write nfsd:nfsd_deleg_read nfsd:nfsd_deleg_return nfsd:nfsd_vfs_setattr nfsd:nfsd_cb_getattr_done nfsd:nfsd_cb_recall_done' }}
      artifact: xfstests-uml-results-${{ matrix.linux_ref }}-${{ matrix.variant.name }}

  # The candidate fix in patches/svcauth-gss-unwrap-priv-krb5p.patch, on
  # master with sec=krb5p, with and without the patch. Without it
  # generic/486 fails (see the patch header); with it, it should pass and
  # nothing else should change. No coverage or tracing.
  xfstests-uml-krb5p-fix:
    name: xfstests (UML, linux master, krb5p, svcauth_gss unwrap fix ${{ matrix.fix }})
    strategy:
      fail-fast: false
      matrix:
        fix: ['with', 'without']
    uses: ./.github/workflows/xfstests-uml-run.yml
    with:
      linux_ref: master
      variant: '{ "name": "krb5p", "vers": "4.2", "delegations": "on", "opts": "", "sec": "krb5p" }'
      patches: ${{ matrix.fix == 'with' && 'svcauth-gss-unwrap-priv-krb5p.patch' || '' }}
      check_args: ${{ inputs.check_args || '-g quick' }}
      artifact: xfstests-uml-results-master-krb5p-${{ matrix.fix }}-fix
