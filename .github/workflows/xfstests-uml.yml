name: NFS xfstests (UML)

# Runs upstream xfstests against NFS inside a User Mode Linux kernel built
# from each linux_ref, so the NFS client and knfsd under test are that
# kernel's, unlike the NFS xfstests workflow, which can only test the
# runner's own kernel. The steps are .github/actions/xfstests-uml; the mount
# and server configurations are this workflow's own matrix. coverage.yml has
# a separate one on purpose, so changing either does not silently change the
# other.

on:
  push:
    branches: [master]
  pull_request:
  # Same cadence as kunit.yml. All three refs in the main matrix move, so a
  # schedule run builds all of them; only the pinned-commit job is skipped.
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

# master comes from the stable tree. nfsd-testing and nfsd-next exist only in
# the NFSD tree (cel/linux.git on git.kernel.org); NFSD_URL is its GitHub
# copy. nfsd-testing is where submissions land and soak, so it is the line
# this repo's candidate fixes are aimed at.
env:
  STABLE_URL: https://github.com/gregkh/linux.git # https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
  NFSD_URL: https://github.com/chucklever/linux.git
  # Applied to the xfstests submodule on every entry. Each fixes the tests,
  # not the kernel, so no configuration should run without it.
  XFSTESTS_PATCHES: >-
    0001-common-reflink-reap-_compare_range-readers.patch
  TRACE_EVENTS: 'nfs4:nfs4_set_delegation nfs4:nfs4_setattr nfs4:nfs4_delegreturn nfs4:nfs4_delegreturn_exit nfs4:nfs4_cb_getattr nfs4:nfs4_cb_recall nfs:nfs_setattr_enter nfsd:nfsd_deleg_write nfsd:nfsd_deleg_read nfsd:nfsd_deleg_return nfsd:nfsd_vfs_setattr nfsd:nfsd_cb_getattr_done nfsd:nfsd_cb_recall_done'

jobs:
  xfstests-uml:
    name: xfstests (UML, ${{ matrix.linux_ref }}, ${{ matrix.cfg.name }})
    runs-on: ubuntu-24.04
    # -g quick took 73-77 minutes per leg. Below the 6-hour limit so a slow
    # leg still uploads its results.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # One job per linux_ref and cfg pair. A field a cfg leaves out is
      # empty, so each cfg states only what differs. "name" must be unique,
      # since it is part of the artifact name.
      #
      # The candidate fixes in patches/ belong to the configuration each one
      # concerns, so krb5i and v3 name theirs; every other cfg tests the tree
      # as it stands. "patches" applies on every ref. "nfsd_testing_patches"
      # applies on nfsd-testing only: nfsd-acl-accept-empty-access-acl.patch
      # fixes the xdrgen SETACL decoder, which master and nfsd-next do not
      # have, so it does not apply there.
      matrix:
        # linux_ref: [master, nfsd-testing, nfsd-next]
        linux_ref: [nfsd-testing]
        cfg:
          - name: delegations-off
            vers: '4.2'
            delegations: 'off'
          - name: delegations-on
            vers: '4.2'
          - name: v4.1
            vers: '4.1'
          - name: v4.0
            vers: '4.0'
          # The fix for the SETACL regression described below and in
          # docs/nfsd-v3-acl-setacl-regression.md.
          - name: v3
            vers: '3'
            nfsd_testing_patches: nfsd-acl-accept-empty-access-acl.patch
          - name: nconnect-4
            vers: '4.2'
            opts: nconnect=4
          - name: krb5i
            vers: '4.2'
            sec: krb5i
            patches: svc-send-account-reply-pages.patch sunrpc-resend-after-rejected-reply.patch
          - name: krb5p
            vers: '4.2'
            sec: krb5p

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xfstests-uml
        with:
          linux_ref: ${{ matrix.linux_ref }}
          linux_url: ${{ startsWith(matrix.linux_ref, 'nfsd-') && env.NFSD_URL || env.STABLE_URL }}
          nfs_vers: ${{ matrix.cfg.vers }}
          nfs_opts: ${{ matrix.cfg.opts }}
          nfs_sec: ${{ matrix.cfg.sec }}
          nfs_delegations: ${{ matrix.cfg.delegations || 'on' }}
          patches: ${{ matrix.cfg.patches }} ${{ matrix.linux_ref == 'nfsd-testing' && matrix.cfg.nfsd_testing_patches || '' }}
          xfstests_patches: ${{ env.XFSTESTS_PATCHES }}
          check_args: '-g quick'
          trace_events: ${{ env.TRACE_EVENTS }}
          artifact: xfstests-uml-results-${{ matrix.linux_ref }}-${{ matrix.cfg.name }}
