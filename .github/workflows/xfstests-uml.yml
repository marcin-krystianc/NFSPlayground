name: NFS xfstests (UML)

# Runs upstream xfstests against NFS inside a User Mode Linux kernel built
# from each linux_ref, so the NFS client and knfsd under test are that
# kernel's, unlike the NFS xfstests workflow, which can only test the
# runner's own kernel. The steps are .github/actions/xfstests-uml; the mount
# and server configurations are this workflow's own matrix. coverage.yml has
# a separate one on purpose, so changing either does not silently change the
# other.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      check_args:
        description: 'Arguments for xfstests check.'
        required: false
        default: '-g quick'
      trace_events:
        description: 'Kernel trace events recorded in the guest (uml-run/trace.txt). Empty uses the default list below.'
        required: false

permissions:
  contents: read

jobs:
  xfstests-uml:
    name: xfstests (UML, linux master, ${{ matrix.name }})
    runs-on: ubuntu-latest
    # -g quick took 73-77 minutes per leg. Below the 6-hour limit so a slow
    # leg still uploads its results.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # include with no other matrix key gives one job per entry. A base
      # dimension alongside it would instead merge every entry into that
      # dimension's combinations, collapsing this to a single job. A field an
      # entry leaves out is empty, so each one states only what differs. The candidate fixes in patches/
      # belong to the configuration each one concerns, so krb5i and krb5p
      # name theirs; every other entry tests the tree as it stands.
      matrix:
        include:
          - name: delegations-off
            vers: '4.2'
            delegations: 'off'
          - name: delegations-on
            vers: '4.2'
          - name: v4.1
            vers: '4.1'
          - name: v4.0
            vers: '4.0'
          - name: v3
            vers: '3'
          - name: nconnect-4
            vers: '4.2'
            opts: nconnect=4
          - name: krb5i
            vers: '4.2'
            sec: krb5i
            patches: svc-send-account-reply-pages.patch
          - name: krb5p
            vers: '4.2'
            sec: krb5p
            patches: svcauth-gss-unwrap-priv-krb5p.patch
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xfstests-uml
        with:
          linux_ref: master
          nfs_vers: ${{ matrix.vers }}
          nfs_opts: ${{ matrix.opts }}
          nfs_sec: ${{ matrix.sec }}
          nfs_delegations: ${{ matrix.delegations || 'on' }}
          exclude_file: ${{ matrix.exclude_file }}
          patches: ${{ matrix.patches }}
          check_args: ${{ inputs.check_args || '-g quick' }}
          trace_events: ${{ inputs.trace_events || 'nfs4:nfs4_set_delegation nfs4:nfs4_setattr nfs4:nfs4_delegreturn nfs4:nfs4_delegreturn_exit nfs4:nfs4_cb_getattr nfs4:nfs4_cb_recall nfs:nfs_setattr_enter nfsd:nfsd_deleg_write nfsd:nfsd_deleg_read nfsd:nfsd_deleg_return nfsd:nfsd_vfs_setattr nfsd:nfsd_cb_getattr_done nfsd:nfsd_cb_recall_done' }}
          artifact: xfstests-uml-results-master-${{ matrix.name }}
