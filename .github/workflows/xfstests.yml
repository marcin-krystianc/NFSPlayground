name: NFS xfstests

# Runs real xfstests against a real NFS mount, on whatever NFS client and
# server modules the runner's own kernel already has. No kernel is built and
# nothing is installed into the kernel: the runner exports two directories
# from its own knfsd over the loopback interface and mounts them back with
# its own NFS client.
#
# Everything is in scripts/00-run-xfstests-on-gh-ci.sh, deliberately: the job is
# one line, so a failure here reproduces on any throwaway Ubuntu box with the
# same single command instead of by reading YAML and replaying steps by hand.
# Its sibling scripts/00-run-xfstests-on-vm-and-docker.sh does the same
# against the docker servers.
#
# This is the complement to the NFS KUnit workflow. KUnit tests kernel
# functions directly under UML; this exercises the shipped client/server pair
# through the userspace test suite they are actually validated with. What it
# cannot do is test a *different* kernel -- the runner's is fixed, so this
# says nothing about VAST's modules or about any kernel but the runner's.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      check_args:
        description: 'Arguments for xfstests check. Default matches CI; "-g quick" is 645 tests and runs for hours.'
        required: false
        default: '-g quick'

concurrency:
  group: xfstests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xfstests:
    runs-on: ubuntu-latest
    # The default set measured ~14 minutes on a 6.8 Ubuntu box, plus a few
    # minutes for apt and the xfstests build. Budget is ~3x for a slower
    # runner; the step has its own timeout so one wedged test cannot eat the
    # whole job silently.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # xfstests is a submodule and is the thing being run here.
          submodules: true

      - name: Run xfstests against loopback NFS
        id: run
        timeout-minutes: 50
        shell: bash
        env:
          CHECK_ARGS: ${{ inputs.check_args || '-g quick' }}
          # Left off: a measured runner had / as 145G ext4 with 84G available,
          # so there is nothing to reclaim. Set to 1 if the "disk space before
          # setup" report in the log ever shows otherwise -- the script will
          # then delete the preinstalled toolchains and report what each was
          # worth. (GitHub documents 14GB of storage; that is not what the
          # runner actually provides, so trust the log over the docs.)
          RECLAIM_DISK: '0'
        run: |
          set -o pipefail
          bash scripts/00-run-xfstests-in-container.sh $CHECK_ARGS 2>&1 \
            | tee xfstests.log

      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            echo "### Environment"
            echo
            echo '```'
            sed -n '/^==> under test/,/^$/p' xfstests.log 2>/dev/null | head -6
            echo '```'
            echo
            echo "### Results"
            echo
            echo '```'
            # check's trailer: the Ran/Not run/Failures/passed lines.
            sed -n '/^Ran:/,$p' xfstests.log 2>/dev/null | head -40 \
              || echo "no result trailer -- the run did not finish"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # results/ holds the .out.bad and .full files for every failure, which
      # is the only way to diagnose one after the fact.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfstests-results
          path: |
            xfstests.log
            xfstests/results/
          if-no-files-found: warn
