name: KUnit

# Runs the NFS/SunRPC KUnit suites in kunit/ under User Mode Linux, via
# scripts/kunit/run-sunrpc-kunit.sh. No VM and no kernel install: kunit.py
# builds an ARCH=um kernel and runs it as an ordinary process.

on:
  # The two path lists are duplicated on purpose: GitHub Actions does not
  # support YAML anchors, so they have to be kept in step by hand.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      extra_args:
        description: 'Extra kunit.py arguments (e.g. --raw_output)'
        required: false
        default: ''

concurrency:
  group: kunit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kunit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        # The submodules (xfstests, pynfs, nfs-utils) are not needed here.
        with:
          submodules: false

      # KUnit has no dependencies of its own; these are the kernel's.
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev

      # LINUX_FULL=1 is required, not an optimisation: kunit.py runs kbuild,
      # and the default sparse checkout (fs/nfs, net/sunrpc and friends) has
      # no scripts/, arch/um, init/, kernel/, mm/ or lib/. Roughly 1.7 GB,
      # re-fetched on every run since the tree is not cached.
      - name: Fetch the kernel tree
        run: LINUX_FULL=1 bash scripts/fetch-sources.sh linux

      # CONFIG_UBSAN=n is deliberate. With UBSAN on, this kernel reports two
      # misaligned accesses in kernel/exit.c:774, which are pre-existing in
      # v6.12.57 under UML and unrelated to anything in kunit/. kunit.py
      # attributes them to whichever test happened to be running, so they
      # surface as two failures that move around between runs. The kernel is
      # pinned, so this only needs revisiting when the pin is bumped.
      #
      # --json needs the `=` form: its value is optional (nargs='?'), so
      # `--json path` leaves --json empty and path is taken as the positional
      # filter_glob instead, which silently runs zero tests.
      - name: Run the KUnit suites
        shell: bash
        env:
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          set -o pipefail
          bash scripts/kunit/run-sunrpc-kunit.sh \
            --kconfig_add CONFIG_UBSAN=n \
            --json="${GITHUB_WORKSPACE}/kunit-results.json" \
            $EXTRA_ARGS 2>&1 | tee kunit.log

      - name: Summarise
        if: always()
        shell: bash
        run: |
          grep -E '^\[.*\] (Testing complete|Failures:)' kunit.log \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kunit-results
          path: |
            kunit.log
            kunit-results.json
          if-no-files-found: warn
