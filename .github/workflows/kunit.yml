name: NFS KUnit

# Runs the NFS/SunRPC KUnit suites in kunit/ under User Mode Linux, via
# scripts/kunit/run-sunrpc-kunit.sh. No VM and no kernel install: kunit.py
# builds an ARCH=um kernel and runs it as an ordinary process.

on:
  # The two path lists are duplicated on purpose: GitHub Actions does not
  # support YAML anchors, so they have to be kept in step by hand.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      filter_glob:
        description: 'kunit.py filter_glob (suite.case globs, e.g. "xfstests/generic/0*"). Default runs only the addr_test family while the whole-run live-lock (see docs/kunit-sunrpc.md) is unresolved.'
        required: false
        default: ''
      extra_args:
        description: 'Extra kunit.py arguments (e.g. --raw_output)'
        required: false
        default: ''
      apply_um_livelock_fix:
        description: 'For the kunit-v6.12.57-patched job only: apply patches/um-thread-info-in-task-v6.12.57.patch (a backport of upstream 2f681ba4b352, "um: move thread info into task", which fixes the UML host-signal live-lock -- see docs/kunit-sunrpc.md) before building. Set to false to build that job''s v6.12.57 leg unpatched, e.g. to re-confirm the live-lock still reproduces upstream.'
        type: boolean
        required: false
        default: true

jobs:
  kunit:
    name: kunit (linux ${{ matrix.linux_ref }})
    runs-on: ubuntu-latest
    # master can fail before any test runs: run-sunrpc-kunit.sh exposes
    # static kernel functions by name, and upstream can rename one.
    strategy:
      fail-fast: false
      matrix:
        linux_ref: [v6.12.57, v6.18.52, v7.2.6, master]

    steps:
      - uses: actions/checkout@v4
        # The submodules (xfstests, pynfs, nfs-utils) are not needed here.
        with:
          submodules: false

      # KUnit has no dependencies of its own; these are the kernel's.
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev

      # fetch-sources.sh does a full clone. Roughly 1.7 GB, re-fetched on
      # every run since the tree is not cached.
      - name: Fetch the kernel tree
        env:
          LINUX_REF: ${{ matrix.linux_ref }}
        run: bash scripts/fetch-sources.sh linux

      # CONFIG_UBSAN=n is deliberate. With UBSAN on, the pinned kernel reports
      # two misaligned accesses in kernel/exit.c:774, pre-existing in
      # v6.12.57 under UML and unrelated to anything in kunit/. kunit.py
      # attributes them to whichever test happened to be running, so they
      # surface as two failures that move around between runs. Applied to
      # both matrix legs uniformly: whether the same misalignment still
      # exists on current mainline is not tracked, and UBSAN's own findings
      # are not what either leg is testing for.
      #
      # --json needs the `=` form: its value is optional (nargs='?'), so
      # `--json path` leaves --json empty and path is taken as the positional
      # filter_glob instead, which silently runs zero tests.
      # filter_glob defaults to the addr_test family, not the full suite.
      # A full run intermittently live-locks in UML after every xfstests
      # suite has run, in the pure-logic SunRPC suites that follow -- see
      # "An intermittent whole-run live-lock" in docs/kunit-sunrpc.md. That
      # is unrelated to addr_test itself (every suite, including this one,
      # passes in isolation); the family is filtered in here only because it
      # is small, fast and exercises none of the nfsd bring-up/teardown the
      # leading hypothesis blames. Pass filter_glob='*' (workflow_dispatch)
      # to run everything, at the cost of the run occasionally hanging until
      # the job timeout.
      - name: Run the KUnit suites
        shell: bash
        env:
          FILTER_GLOB: ${{ inputs.filter_glob || '*' }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          set -o pipefail
          bash scripts/kunit/run-sunrpc-kunit.sh \
            --kconfig_add CONFIG_UBSAN=n \
            --json="${GITHUB_WORKSPACE}/kunit-results.json" \
            "$FILTER_GLOB" \
            $EXTRA_ARGS 2>&1 | tee kunit.log

      - name: Summarise
        if: always()
        shell: bash
        run: |
          grep -E '^\[.*\] (Testing complete|Failures:)' kunit.log \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kunit-results-${{ matrix.linux_ref }}
          path: |
            kunit.log
            kunit-results.json
          if-no-files-found: warn

  # Separate from the kunit matrix above: v6.12.57 with the host-signal
  # live-lock fix backported (see docs/kunit-sunrpc.md, "A confirmed
  # host-signal live-lock on v6.12.57"). The matrix leg intentionally
  # stays unpatched, so this job is the one place that continuously
  # confirms the patch still applies to the pinned tag and still lets a
  # full, unfiltered run finish without hanging.
  kunit-v6-12-57-patched:
    name: kunit (linux v6.12.57, live-lock fix backported)
    runs-on: ubuntu-latest
    # A full run should no longer live-lock with the fix applied; this
    # bounds the job in case that assumption stops holding, instead of
    # consuming the runner's default multi-hour budget.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev

      - name: Fetch the kernel tree
        env:
          LINUX_REF: v6.12.57
        run: bash scripts/fetch-sources.sh linux

      - name: Apply the UML host-signal live-lock fix
        if: ${{ inputs.apply_um_livelock_fix != false }}
        run: |
          git -C linux apply --check patches/um-thread-info-in-task-v6.12.57.patch
          git -C linux apply patches/um-thread-info-in-task-v6.12.57.patch

      # Same CONFIG_UBSAN=n rationale as the kunit job above. filter_glob
      # defaults to '*' (see FILTER_GLOB below): the whole point of this
      # leg is to run the full, unfiltered suite and show it completing
      # without the live-lock.
      - name: Run the KUnit suites
        shell: bash
        env:
          FILTER_GLOB: ${{ inputs.filter_glob || '*' }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          set -o pipefail
          bash scripts/kunit/run-sunrpc-kunit.sh \
            --kconfig_add CONFIG_UBSAN=n \
            --json="${GITHUB_WORKSPACE}/kunit-results.json" \
            "$FILTER_GLOB" \
            $EXTRA_ARGS 2>&1 | tee kunit.log

      - name: Summarise
        if: always()
        shell: bash
        run: |
          grep -E '^\[.*\] (Testing complete|Failures:)' kunit.log \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kunit-results-v6.12.57-patched
          path: |
            kunit.log
            kunit-results.json
          if-no-files-found: warn
