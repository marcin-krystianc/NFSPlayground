name: NFS KUnit

# Runs the NFS/SunRPC KUnit suites in kunit/ under User Mode Linux, via
# scripts/kunit/run-sunrpc-kunit.sh. No VM and no kernel install: kunit.py
# builds an ARCH=um kernel and runs it as an ordinary process.

on:
  # The two path lists are duplicated on purpose: GitHub Actions does not
  # support YAML anchors, so they have to be kept in step by hand.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      filter_glob:
        description: 'kunit.py filter_glob (suite.case globs, e.g. "xfstests/generic/0*"). Default runs only the addr_test family while the whole-run live-lock (see docs/kunit-sunrpc.md) is unresolved.'
        required: false
        default: ''
      extra_args:
        description: 'Extra kunit.py arguments (e.g. --raw_output)'
        required: false
        default: ''

jobs:
  kunit:
    name: kunit (linux ${{ matrix.linux_ref }})
    runs-on: ubuntu-latest
    # master can fail before any test runs: run-sunrpc-kunit.sh exposes
    # static kernel functions by name, and upstream can rename one.
    strategy:
      fail-fast: false
      matrix:
        linux_ref: [v6.12.57, master]

    steps:
      - uses: actions/checkout@v4
        # The submodules (xfstests, pynfs, nfs-utils) are not needed here.
        with:
          submodules: false

      # KUnit has no dependencies of its own; these are the kernel's.
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev

      # LINUX_FULL=1 is required, not an optimisation: kunit.py runs kbuild,
      # and the default sparse checkout (fs/nfs, net/sunrpc and friends) has
      # no scripts/, arch/um, init/, kernel/, mm/ or lib/. Roughly 1.7 GB,
      # re-fetched on every run since the tree is not cached.
      #
      - name: Fetch the kernel tree
        env:
          LINUX_REF: ${{ matrix.linux_ref }}
        run: LINUX_FULL=1 bash scripts/fetch-sources.sh linux

      # CONFIG_UBSAN=n is deliberate. With UBSAN on, the pinned kernel reports
      # two misaligned accesses in kernel/exit.c:774, pre-existing in
      # v6.12.57 under UML and unrelated to anything in kunit/. kunit.py
      # attributes them to whichever test happened to be running, so they
      # surface as two failures that move around between runs. Applied to
      # both matrix legs uniformly: whether the same misalignment still
      # exists on current mainline is not tracked, and UBSAN's own findings
      # are not what either leg is testing for.
      #
      # --json needs the `=` form: its value is optional (nargs='?'), so
      # `--json path` leaves --json empty and path is taken as the positional
      # filter_glob instead, which silently runs zero tests.
      # filter_glob defaults to the addr_test family, not the full suite.
      # A full run intermittently live-locks in UML after every xfstests
      # suite has run, in the pure-logic SunRPC suites that follow -- see
      # "An intermittent whole-run live-lock" in docs/kunit-sunrpc.md. That
      # is unrelated to addr_test itself (every suite, including this one,
      # passes in isolation); the family is filtered in here only because it
      # is small, fast and exercises none of the nfsd bring-up/teardown the
      # leading hypothesis blames. Pass filter_glob='*' (workflow_dispatch)
      # to run everything, at the cost of the run occasionally hanging until
      # the job timeout.
      - name: Run the KUnit suites
        shell: bash
        env:
          FILTER_GLOB: ${{ inputs.filter_glob || 'sunrpc-addr-*' }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          set -o pipefail
          bash scripts/kunit/run-sunrpc-kunit.sh \
            --kconfig_add CONFIG_UBSAN=n \
            --json="${GITHUB_WORKSPACE}/kunit-results.json" \
            "$FILTER_GLOB" \
            $EXTRA_ARGS 2>&1 | tee kunit.log

      - name: Summarise
        if: always()
        shell: bash
        run: |
          grep -E '^\[.*\] (Testing complete|Failures:)' kunit.log \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kunit-results-${{ matrix.linux_ref }}
          path: |
            kunit.log
            kunit-results.json
          if-no-files-found: warn
